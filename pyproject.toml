[project]
name = "stillroom-lab"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = ["Faker==37.6.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "mypy==1.18.2", "PyYAML==6.0.2", "types-PyYAML==6.0.12.20250915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sources", "tests"]
